<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cthulhu & Chill</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Crimson+Pro:wght@400;500;600&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Background layer -->
  <div id="background-layer"></div>

  <!-- Main container -->
  <div class="container">
    <!-- Top bar -->
    <header class="top-bar">
      <div class="top-bar-left">
        <h1 class="game-title"><img src="icons/squid-head.svg" class="title-icon" width="28" height="28" alt=""> <span id="game-name">New Game</span></h1>
        <select id="game-select" class="game-select">
          <option value="">Select a game...</option>
        </select>
        <button id="new-game-btn" class="btn-secondary">New Game</button>
      </div>
      <div class="top-bar-right">
        <div id="music-link-area" class="music-link"><img src="icons/musical-notes.svg" class="music-icon" width="16" height="16" alt=""> <a href="#" id="music-link">Music</a></div>
        <button id="background-upload-btn" class="btn-secondary">Change Background</button>
        <input type="file" id="background-file-input" accept="image/*" style="display: none;">
      </div>
    </header>

    <!-- Main grid area -->
    <main class="game-grid">
      <!-- Row 1: player, keeper, player -->
      <div class="grid-cell" id="slot-r1c1"></div>
      <div class="grid-cell" id="slot-keeper"></div>
      <div class="grid-cell" id="slot-r1c3"></div>

      <!-- Row 2: player, dice roller, player -->
      <div class="grid-cell" id="slot-r2c1"></div>
      <section class="dice-area">
        <div id="result-display" class="result-display">
          <div class="result-number" id="result-number"></div>
          <div class="result-outcome" id="result-outcome">Roll the dice</div>
          <div class="result-detail" id="result-detail"></div>
        </div>
        <div class="preset-buttons">
          <button class="btn-d100" data-die="100" title="d100"><img src="icons/d10.svg" class="die-icon-d100" alt=""><img src="icons/d10.svg" class="die-icon-d100" alt=""></button>
          <button class="btn-die" data-die="4" title="d4"><img src="icons/d4.svg" class="die-icon" alt="d4"></button>
          <button class="btn-die" data-die="6" title="d6"><img src="icons/d6.svg" class="die-icon" alt="d6"></button>
          <button class="btn-die" data-die="8" title="d8"><img src="icons/d8.svg" class="die-icon" alt="d8"></button>
          <button class="btn-die" data-die="10" title="d10"><img src="icons/d10.svg" class="die-icon" alt="d10"></button>
          <button class="btn-die" data-die="12" title="d12"><img src="icons/d12.svg" class="die-icon" alt="d12"></button>
          <button class="btn-die" data-die="20" title="d20"><img src="icons/d20.svg" class="die-icon" alt="d20"></button>
        </div>
        <div class="die-tray">
          <div class="tray-header">
            <span>Dice Tray</span>
            <button id="clear-tray-btn" class="btn-clear-tray" title="Clear tray"><img src="icons/trash-can.svg" width="14" height="14" alt="Clear"></button>
          </div>
          <div id="tray-content" class="tray-content">
            <span class="tray-empty"></span>
          </div>
        </div>
        <div class="skill-roll-row">
          <label for="skill-value">Skill %:</label>
          <input type="number" id="skill-value" min="0" max="100">
          <span id="roll-identity" class="roll-identity"></span>
          <button id="roll-btn" class="btn-roll">ROLL</button>
        </div>
      </section>
      <div class="grid-cell" id="slot-r2c3"></div>

      <!-- Row 3: player, roll log, add/overflow -->
      <div class="grid-cell" id="slot-r3c1"></div>
      <div class="roll-log">
        <h3></h3>
        <div id="roll-log-content" class="roll-log-content">
          <div class="log-empty"></div>
        </div>
      </div>
      <div class="grid-cell" id="slot-r3c3"></div>
    </main>
    <div class="attribution">Icons by <a href="https://game-icons.net" target="_blank" rel="noopener">game-icons.net</a> (CC BY 3.0)</div>
  </div>

  <!-- Templates -->
  <template id="character-tile-template">
    <div class="character-tile" data-char-id="" data-role="player">
      <img class="frame-corner frame-corner-tl" src="icons/corner-vintage.png" alt="">
      <img class="frame-corner frame-corner-tr" src="icons/corner-vintage.png" alt="">
      <img class="frame-corner frame-corner-br" src="icons/corner-vintage.png" alt="">
      <img class="frame-corner frame-corner-bl" src="icons/corner-vintage.png" alt="">
      <div class="tile-actions">
        <button class="btn-tile-edit" title="Edit"><svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M11.5 1.5l3 3L5 14H2v-3z"/></svg></button>
        <button class="btn-tile-claim" title="Claim"><svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="5" r="3"/><path d="M2 15c0-3.3 2.7-6 6-6s6 2.7 6 6"/></svg></button>
      </div>
      <div class="tile-portrait-wrap">
        <img class="tile-portrait" src="" alt="">
      </div>
      <div class="tile-info">
        <div class="tile-player-name"></div>
        <div class="tile-character-name"></div>
      </div>
      <div class="tile-stats">
        <div class="stat" data-stat="hp">
          <span class="stat-label">HP</span>
          <button class="stat-dec">−</button>
          <input type="number" class="stat-value" min="0">
          <button class="stat-inc">+</button>
        </div>
        <div class="stat" data-stat="sanity">
          <span class="stat-label">SAN</span>
          <button class="stat-dec">−</button>
          <input type="number" class="stat-value" min="0">
          <button class="stat-inc">+</button>
        </div>
        <div class="stat" data-stat="luck">
          <span class="stat-label">Luck</span>
          <button class="stat-dec">−</button>
          <input type="number" class="stat-value" min="0">
          <button class="stat-inc">+</button>
        </div>
      </div>
    </div>
  </template>

  <template id="add-character-template">
    <div class="add-character-tile">
      <button class="btn-add-character">+</button>
    </div>
  </template>

  <!-- New Game Modal -->
  <div id="new-game-modal" class="modal-overlay" hidden>
    <div class="modal">
      <button type="button" id="delete-game-btn" class="btn-delete-game" title="Delete game" hidden><img src="icons/trash-can.svg" width="16" height="16" alt="Delete"></button>
      <h2 class="modal-title" id="game-modal-title">New Game</h2>
      <form id="new-game-form">
        <label for="new-game-name">Game Name</label>
        <input type="text" id="new-game-name" required placeholder="e.g. The Usual Suspects">
        <label for="new-game-music">Music Link <span class="label-optional">(optional)</span></label>
        <input type="url" id="new-game-music" placeholder="https://youtube.com/...">
        <label for="new-game-frame">Character Frames</label>
        <select id="new-game-frame" class="game-select">
          <option value="vintage">Vintage</option>
          <option value="art-deco">Art Deco</option>
          <option value="engraved">Engraved</option>
          <option value="eldritch">Eldritch</option>
        </select>
        <div class="modal-actions">
          <button type="submit" class="btn-roll" id="game-modal-submit">Create</button>
          <button type="button" id="new-game-cancel" class="btn-secondary">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Character Modal (create & edit) -->
  <div id="char-modal" class="modal-overlay" hidden>
    <div class="modal char-modal">
      <h2 class="modal-title" id="char-modal-title">New Character</h2>
      <form id="char-modal-form">
        <div class="char-modal-portrait-wrap" id="char-modal-portrait-wrap">
          <img id="char-modal-portrait" src="" alt="" draggable="false">
          <div class="char-modal-portrait-hint">Click or Ctrl+V</div>
        </div>
        <input type="file" id="char-modal-file-input" accept="image/*" style="display: none;">
        <input name="playerName" placeholder="Your name" required>
        <input name="characterName" placeholder="Character name" required>
        <div class="char-modal-stats" id="char-modal-stats">
          <div class="char-modal-stat">
            <label>HP</label>
            <input name="hp" type="number" min="0" max="99">
          </div>
          <div class="char-modal-stat">
            <label>SAN</label>
            <input name="sanity" type="number" min="0" max="99">
          </div>
          <div class="char-modal-stat">
            <label>Luck</label>
            <input name="luck" type="number" min="0" max="99">
          </div>
        </div>
        <label class="keeper-toggle" id="char-modal-keeper-toggle">
          <input type="checkbox" name="isKeeper" id="char-modal-keeper-cb"> I'm the Keeper
        </label>
        <div class="modal-actions">
          <button type="submit" class="btn-roll" id="char-modal-submit">Join</button>
          <button type="button" id="char-modal-cancel" class="btn-secondary">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Portrait Crop Modal -->
  <div id="crop-modal" class="modal-overlay" hidden>
    <div class="modal crop-modal">
      <h2 class="modal-title">Position Portrait</h2>
      <div class="crop-viewport">
        <img id="crop-image" draggable="false" alt="">
      </div>
      <p class="crop-hint">Drag to position, mouse wheel to zoom</p>
      <div class="modal-actions">
        <button type="button" id="crop-confirm" class="btn-roll">Save</button>
        <button type="button" id="crop-cancel" class="btn-secondary">Cancel</button>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
